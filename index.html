<!DOCTYPE html>
<html>
<body>

<button onclick="generateCharacter()">Generate Character</button>

<pre id="output"></pre>

<script>
// === replacements for your modules (TEMP placeholders) ===
function gen_stat() {
    let xlist = [];
    for (let b = 0; b < 4; b++) {
        xlist.push(Math.floor(Math.random() * 6) + 1);
    }
    xlist.sort((a,b) => a-b);
    xlist.shift(); // remove lowest
    return xlist[0] + xlist[1] + xlist[2];
}

function choose_class(stat1, stat2) {
    // stat1 = ["str", 18], stat2 = ["dex", 16]
    let top_stat = stat1[0];
    let second_stat = stat2[0];

    const class_choices = {
        "str,con": "Barbarian",
        "str,dex": "Fighter",
        "str,wis": "Cleric",
        "str,cha": "Paladin",
        "str,int": "Paladin",
        "dex,int": "Rogue",
        "dex,wis": "Monk",
        "dex,cha": "Bard",
        "dex,con": "Rogue",
        "int,wis": "Wizard",
        "int,cha": "Warlock",
        "int,con": "Sorcerer",
        "wis,cha": "Druid",
        "wis,con": "Cleric",
        "cha,con": "Bard",
    };

    // normalize order (this replaces your double .get())
    let key = [top_stat, second_stat].sort().join(",");

    return class_choices[key] || "Fighter";
}

function choose_race(dnd_class) {
    const race_choices = {
        "Barbarian": ["Half-Orc", "Dwarf", "Goliath"],
        "Fighter": ["Human", "Half-Elf", "Dwarf", "Half-Orc"],
        "Monk": ["Wood Elf", "Human", "Halfling", "Half-Elf"],
        "Rogue": ["Halfling", "Lightfoot Halfling", "Wood Elf", "Human"],
        "Bard": ["Half-Elf", "Tiefling", "Human", "Satyr", "Gnome"],
        "Cleric": ["Dwarf", "Human", "Aasimar", "Half-Elf"],
        "Paladin": ["Human", "Half-Elf", "Dragonborn", "Tiefling", "Dwarf"],
        "Ranger": ["Wood Elf", "Human", "Half-Elf", "Halfling", "Half-Orc"],
        "Warlock": ["Tiefling", "Half-Elf", "Human", "Half-Orc"],
        "Wizard": ["High Elf", "Human", "Gnome", "Tiefling", "Half-Elf"],
        "Druid": ["Wood Elf", "Firbolg", "Human", "Halfling"],
        "Sorcerer": ["Dragonborn", "Tiefling", "Human", "Half-Elf"],
    };

    let choices = race_choices[dnd_class] || ["No valid races found for this class"];

    function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    let race = randomChoice(choices);

    // reroll if Human (same logic as your Python)
    if (race === "Human") {
        race = randomChoice(choices);
    }

    return race;
}

const all_languages = [
    "Common", "Elvish", "Dwarvish", "Draconic", "Giant", "Goblin", 
    "Halfling", "Orc", "Infernal", "Celestial", "Sylvan", "Abyssal", 
    "Primordial", "Gnomish", "Aquan", "Terran", "Ignan", 
    "Fey", "Undercommon", "Deep Speech", "Thieves' Cant"
];

function gen_langs(race, char_class) {
    const race_languages = {
        "Human": ["Common"],
        "Elf": ["Common", "Elvish"],
        "Dwarf": ["Common", "Dwarvish"],
        "Half-Elf": ["Common", "Elvish", "Sylvan"],
        "Dragonborn": ["Common", "Draconic"],
        "Halfling": ["Common", "Halfling"],
        "Gnome": ["Common", "Gnomish"],
        "Tiefling": ["Common", "Infernal"],
        "Half-Orc": ["Common", "Orc"],
        "Aasimar": ["Common", "Celestial"],
        "Firbolg": ["Common", "Sylvan"],
        "Satyr": ["Common", "Sylvan"],
        "Goliath": ["Common", "Giant"]
    };

    const class_languages = {
        "Wizard": 1,
        "Sorcerer": 1,
        "Cleric": 1,
        "Bard": 2,
        "Druid": 1,
        "Ranger": 1,
        "Paladin": 1,
        "Warlock": 1,
        "Fighter": 0,
        "Monk": 0,
        "Rogue": 1
    };

    let languages = race_languages[race] ? [...race_languages[race]] : ["Common"];
    let extra_languages = class_languages[char_class] || 0;

    for (let i = 0; i < extra_languages; i++) {
        let available = all_languages.filter(l => !languages.includes(l));
        if (available.length === 0) break;
        let choice = available[Math.floor(Math.random() * available.length)];
        languages.push(choice);
    }

    return languages;
}

const vowels = ["a", "e", "i", "o", "u"];
const consonants = ["b","c","d","f","g","h","j","k","l","m","n","p","q","r","s","t","v","w","x","y","z"];

function gen_name() {
    let name = [];
    let length = Math.floor(Math.random() * 5) + 3; // 3–7 letters
    for (let i = 0; i < length; i++) {
        if (name.length >= 2) {
            if (vowels.includes(name[name.length-1]) && vowels.includes(name[name.length-2])) {
                name.push(consonants[Math.floor(Math.random()*consonants.length)]);
            } else if (consonants.includes(name[name.length-1]) && consonants.includes(name[name.length-2])) {
                name.push(vowels[Math.floor(Math.random()*vowels.length)]);
            } else {
                name.push((vowels.concat(consonants))[Math.floor(Math.random()* (vowels.length + consonants.length))]);
            }
        } else {
            name.push((vowels.concat(consonants))[Math.floor(Math.random()* (vowels.length + consonants.length))]);
        }
    }
    return name.join('').charAt(0).toUpperCase() + name.join('').slice(1);
}

function gen_names(N) {
    let names = [];
    for (let i = 0; i < N; i++) {
        names.push(gen_name());
    }
    return names;
}

function gen_info(dnd_class, race="Human") {
    const hit_dice = {
        "Barbarian": 12, "Fighter": 10, "Monk": 8, "Rogue": 8, "Bard": 8,
        "Cleric": 8, "Paladin": 10, "Ranger": 10, "Warlock": 8, "Wizard": 6,
        "Druid": 8, "Sorcerer": 6
    };

    const spell_slots = {
        "Cleric": 2, "Druid": 2, "Sorcerer": 2, "Warlock": 2, "Wizard": 3,
        "Bard": 2, "Paladin": 0, "Barbarian": 0, "Fighter": 0, "Monk": 0,
        "Rogue": 0, "Ranger": 0
    };

    const proficiencies = {
        "Barbarian": 3, "Fighter": 3, "Monk": 3, "Rogue": 4, "Bard": 4,
        "Cleric": 3, "Paladin": 4, "Ranger": 3, "Warlock": 2, "Wizard": 2,
        "Druid": 2, "Sorcerer": 2
    };

    const race_speeds = {
        "Human": 30, "Elf": 30, "Dwarf": 25, "Halfling": 25,
        "Gnome": 25, "Half-Elf": 30, "Half-Orc": 30, "Tiefling": 30, "Dragonborn": 30,
        "Wood Elf": 35, "Lightfoot Halfling": 25, "High Elf": 30, "Aasimar": 30,
        "Satyr": 40, "Firbolg": 30, "Goliath": 30
    };

    const alignments = [
        "Lawful Good", "Neutral Good", "Chaotic Good", "Lawful Neutral", 
        "True Neutral", "Chaotic Neutral", "Lawful Evil", "Neutral Evil", "Chaotic Evil"
    ];

    let hd = hit_dice[dnd_class] || 8;
    let spell_slots_count = spell_slots[dnd_class] || 0;
    let proficiency_count = proficiencies[dnd_class] || 2;
    let movement_speed = race_speeds[race] || 30;
    let alignment = alignments[Math.floor(Math.random()*alignments.length)];
    let languages = gen_langs(race,dnd_class).join(" ");

    return {
        "Hit Die": hd,
        "Spell Slots at Level 1": spell_slots_count,
        "Proficiencies": proficiency_count,
        "Movement Speed": movement_speed,
        "Alignment": alignment,
        "Known Languages": languages
    };
}

// === your logic ===
function generateCharacter() {

    let stats_list = ["str","dex","con","int","wis","cha"];
    let stats_values = [];

    for (let i = 0; i < 6; i++) {
        let b = gen_stat();
        stats_values.push(b);
    }

    let [str, dex, con, int_, wis, cha] = stats_values;

    let output = "";

    output += "str dex con int wis cha\n";
    output += `${str} ${dex} ${con} ${int_} ${wis} ${cha}\n`;

    output += `${Math.floor((str-10)/2)} `
           + `${Math.floor((dex-10)/2)} `
           + `${Math.floor((con-10)/2)} `
           + `${Math.floor((int_-10)/2)} `
           + `${Math.floor((wis-10)/2)} `
           + `${Math.floor((cha-10)/2)}\n\n`;

    let stats = {str, dex, con, int: int_, wis, cha};

    let sorted_stats = Object.entries(stats)
        .sort((a,b)=>b[1]-a[1]);

    let stat1 = sorted_stats[0];
    let stat2 = sorted_stats[1];

    let charClass = choose_class(stat1, stat2);

    output += `${charClass} ${JSON.stringify(stat1)} ${JSON.stringify(stat2)}\n`;

    let race = choose_race(charClass);
    output += race + "\n";

    let char_info = gen_info(charClass, race);
    for (let key in char_info) {
        output += `${key}: ${char_info[key]}\n`;
    }

    output += gen_names(4).join(" ");

    document.getElementById("output").textContent = output;
}
</script>

</body>
</html>
